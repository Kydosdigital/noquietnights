name: Validate reviews page

on:
  push:
    branches:
      - site/reviews-page
    paths:
      - app/reviews/**
      - app/overrides.css
      - app/page.tsx
      - app/services/service-header.tsx
      - app/pricing/page.tsx
      - .github/workflows/validate-reviews-page.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
